[package]
name = "loom"
version = "0.5.0"
edition = "2024"
description = "A light, keyboard-first home for coding agents (GTK4 + ACP)"
license = "MIT"

[dependencies]
loom-core = { path = "core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
sourceview = { package = "sourceview5", version = "0.11" }
vte = { package = "vte4", version = "0.10", features = ["v0_76"] }
async-channel = "2"
serde_json = { version = "1", features = ["preserve_order"] }
pulldown-cmark = { version = "0.13", default-features = false }
libc = "0.2"
# The Telegram bot (HTTPS via rustls).
ureq = { version = "3", default-features = false, features = ["rustls"] }
qrcode = { version = "0.14.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[workspace]
members = ["core", "link", "remote", "daemon"]

[dev-dependencies]
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

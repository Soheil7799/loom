[package]
name = "loom-core"
version = "0.3.0"
edition = "2024"
description = "What loom does, without a UI: jobs, agents, notes (the GTK app and later ones draw it)"
license = "MIT"

[dependencies]
async-channel = "2"
jiff = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
trash = "5"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
vt100 = "0.16"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

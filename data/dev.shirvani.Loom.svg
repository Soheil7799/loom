<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- loom: three warp threads, two wefts woven through (over, under, over). -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="#1f2430"/>
  <g stroke-linecap="round" stroke-width="10">
    <g stroke="#cccac2">
      <line x1="40" y1="30" x2="40" y2="98"/>
      <line x1="64" y1="30" x2="64" y2="98"/>
      <line x1="88" y1="30" x2="88" y2="98"/>
    </g>
    <g stroke="#ffcc66">
      <line x1="26" y1="52" x2="102" y2="52"/>
      <line x1="26" y1="76" x2="102" y2="76"/>
    </g>
    <!-- Where a warp thread passes over a weft. -->
    <g stroke="#cccac2">
      <line x1="40" y1="45" x2="40" y2="59"/>
      <line x1="88" y1="45" x2="88" y2="59"/>
      <line x1="64" y1="69" x2="64" y2="83"/>
    </g>
  </g>
</svg>
